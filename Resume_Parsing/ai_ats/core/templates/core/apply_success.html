{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 p-12 text-center mt-12 transition-colors">
    
    <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20 rounded-full mb-6">
        <svg class="w-10 h-10 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
    </div>
    
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-4">Application Received!</h1>
    
    <p class="text-slate-600 dark:text-slate-400 mb-10 text-lg">
        Your CV for <strong class="text-slate-900 dark:text-white">{{ job.title }}</strong> has been successfully submitted and is being reviewed.
    </p>
    
    <a href="{% url 'landing_page' %}" class="inline-block bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold text-lg py-3 px-8 rounded-full hover:bg-slate-800 dark:hover:bg-slate-200 shadow-md transition-all">
        &larr; Return Home
    </a>
</div>
{% endblock %}
