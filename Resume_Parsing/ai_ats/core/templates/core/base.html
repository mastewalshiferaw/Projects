<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ATS Sandbox</title>
    <!-- This loads Tailwind CSS instantly -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navigation Bar -->
    <nav class="bg-indigo-600 text-white shadow-md p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="{% url 'job_list' %}" class="text-2xl font-bold tracking-tight">AI ATS Sandbox</a>
            <a href="/admin/" class="text-indigo-200 hover:text-white transition">Admin Panel</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto p-6 mt-6">
        {% block content %}
        <!-- Other pages will inject their HTML right here! -->
        {% endblock %}
    </main>

</body>
</html>
