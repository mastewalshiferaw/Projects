{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 p-8">
    <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2">Create New Job</h1>
        <p class="text-gray-500 dark:text-gray-400">Add the job description below. The AI will use this to grade candidates.</p>
    </div>

    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label for="title" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Job Title</label>
            <input type="text" name="title" id="title" required placeholder="e.g. Senior Python Developer" 
                class="w-full px-4 py-3 rounded-2xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-4 focus:ring-zinc-500/20 focus:border-zinc-500 transition-all outline-none">
        </div>

        <div>
            <label for="description" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Job Requirements & Description</label>
            <textarea name="description" id="description" rows="8" required placeholder="Paste the job requirements here..."
                class="w-full px-4 py-3 rounded-2xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-4 focus:ring-zinc-500/20 focus:border-zinc-500 transition-all outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-4 pt-4">
            <a href="{% url 'job_list' %}" class="px-6 py-3 rounded-2xl font-bold text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white transition">Cancel</a>
            <!-- COZY SPONGY GREY BUTTON -->
            <button type="submit" class="bg-zinc-700 hover:bg-zinc-600 text-zinc-50 font-bold py-3 px-8 rounded-2xl shadow-lg shadow-zinc-300 dark:shadow-none transform transition-all duration-300 hover:-translate-y-1 hover:shadow-xl active:scale-95 active:translate-y-1">
                Publish Job
            </button>
        </div>
    </form>
</div>
{% endblock %}
