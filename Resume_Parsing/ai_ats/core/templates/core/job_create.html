{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-8">
    <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2">Create New Job Posting</h1>
        <p class="text-gray-500 dark:text-gray-400">Add the job description below. The AI will use this to grade candidates.</p>
    </div>

    <!-- The Form -->
    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label for="title" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Job Title</label>
            <input type="text" name="title" id="title" required placeholder="e.g. Senior Python Developer" 
                class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <div>
            <label for="description" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Job Requirements & Description</label>
            <textarea name="description" id="description" rows="8" required placeholder="Paste the job requirements here..."
                class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"></textarea>
        </div>

        <div class="flex justify-end gap-4 pt-4 border-t border-gray-100 dark:border-gray-700">
            <a href="{% url 'job_list' %}" class="px-6 py-3 rounded-lg font-bold text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition">Cancel</a>
            <button type="submit" class="px-6 py-3 rounded-lg font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition shadow-md">
                Publish Job
            </button>
        </div>
    </form>
</div>
{% endblock %}
