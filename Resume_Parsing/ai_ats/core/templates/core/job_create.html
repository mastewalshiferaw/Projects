{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-zinc-900 rounded-2xl shadow-sm border border-zinc-200 dark:border-zinc-800 p-8 sm:p-10">
    <h1 class="text-2xl font-bold text-zinc-900 dark:text-white mb-8 tracking-tight">Create Posting</h1>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
            <input type="text" name="title" placeholder="Job Title" required class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white outline-none focus:bg-white dark:focus:bg-zinc-900 focus:border-zinc-400 transition-colors placeholder-zinc-400">
        </div>
        <div>
            <textarea name="description" rows="8" placeholder="Description & Requirements" required class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white outline-none focus:bg-white dark:focus:bg-zinc-900 focus:border-zinc-400 transition-colors placeholder-zinc-400"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-2">
            <a href="{% url 'job_list' %}" class="px-5 py-3 rounded-xl font-medium text-zinc-500 hover:bg-zinc-50 dark:hover:bg-zinc-800 transition">Cancel</a>
            <button type="submit" class="bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 font-semibold py-3 px-8 rounded-xl hover:opacity-80 transition-opacity">
                Publish
            </button>
        </div>
    </form>
</div>
{% endblock %}
