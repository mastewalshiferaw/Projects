{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white dark:bg-slate-900 rounded-3xl border-2 border-slate-200 dark:border-slate-700 shadow-[8px_8px_0px_0px_rgba(99,102,241,0.2)] p-10 transition-colors duration-300">
    <div class="mb-8">
        <h1 class="text-3xl font-black text-slate-900 dark:text-white mb-2 transition-colors">Create New Job</h1>
        <p class="text-slate-500 dark:text-slate-400 font-medium transition-colors">Add the job description below. The AI will use this to grade candidates.</p>
    </div>

    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 transition-colors">Job Title</label>
            <input type="text" name="title" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:border-indigo-500 outline-none transition-colors">
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 transition-colors">Job Description</label>
            <textarea name="description" rows="8" required class="w-full px-4 py-3 rounded-xl border-2 border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:border-indigo-500 outline-none transition-colors"></textarea>
        </div>

        <div class="flex justify-end gap-4 pt-4">
            <a href="{% url 'job_list' %}" class="px-6 py-3 rounded-xl font-bold text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition">Cancel</a>
            
            <button type="submit" class="bg-indigo-600 text-white border-2 border-indigo-400 font-bold py-3 px-8 rounded-xl shadow-[4px_4px_0px_0px_rgba(99,102,241,0.5)] hover:translate-y-1 hover:translate-x-1 hover:shadow-none transition-all">
                Publish Job
            </button>
        </div>
    </form>
</div>
{% endblock %}
