{% extends 'core/base.html' %}

{% block content %}
<div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold text-zinc-900 dark:text-white tracking-tight">Postings</h1>
    <a href="{% url 'job_create' %}" class="bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 text-sm font-medium py-2.5 px-5 rounded-lg shadow-sm hover:opacity-80 transition-opacity">
        + New Job
    </a>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for job in jobs %}
    <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl p-6 flex flex-col justify-between shadow-sm">
        <div>
            <h2 class="text-xl font-semibold text-zinc-900 dark:text-white mb-1">{{ job.title }}</h2>
            <p class="text-xs text-zinc-400 mb-4">{{ job.created_at|date:"M d, Y" }}</p>
            <p class="text-zinc-600 dark:text-zinc-400 text-sm line-clamp-3 mb-6">{{ job.description }}</p>
        </div>
        <a href="{% url 'job_detail' job.pk %}" class="border border-zinc-200 dark:border-zinc-700 text-zinc-900 dark:text-white text-sm font-medium py-2.5 rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors w-full text-center">
            View
        </a>
    </div>
    {% empty %}
    <div class="col-span-3 text-center text-zinc-500 py-16 border border-dashed border-zinc-200 dark:border-zinc-800 rounded-xl">
        No postings available.
    </div>
    {% endfor %}
</div>
{% endblock %}
