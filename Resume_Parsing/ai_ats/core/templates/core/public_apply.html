{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-zinc-900 rounded-2xl shadow-sm border border-zinc-200 dark:border-zinc-800 p-8 sm:p-10 mt-16 text-center">
    <h1 class="text-xl font-bold text-zinc-900 dark:text-white mb-1">Apply for {{ job.title }}</h1>
    <p class="text-sm text-zinc-500 mb-8">Upload your CV (PDF only).</p>
    
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        <div class="border border-dashed border-zinc-300 dark:border-zinc-700 rounded-xl p-4 bg-zinc-50 dark:bg-zinc-800">
            <input type="file" name="file" accept=".pdf" required class="w-full text-sm text-zinc-500 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-zinc-200 file:text-zinc-900 cursor-pointer">
        </div>
        <button type="submit" class="w-full bg-[#18181B] dark:bg-white text-white dark:text-zinc-900 font-semibold py-3.5 rounded-xl hover:bg-zinc-800 transition-all">Submit Application</button>
    </form>
</div>
{% endblock %}
