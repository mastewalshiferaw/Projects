{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white dark:bg-zinc-900 rounded-2xl shadow-sm border border-zinc-200 dark:border-zinc-800 p-8 sm:p-10 mt-10">
    <h1 class="text-2xl font-bold text-zinc-900 dark:text-white mb-2 tracking-tight">Evaluate CV</h1>
    <p class="text-sm text-zinc-500 mb-8">Compare your resume against any job description.</p>
    
    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        <textarea name="job_description" rows="5" required placeholder="Paste Job Requirements..." class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white outline-none focus:bg-white dark:focus:bg-zinc-900 focus:border-zinc-400 transition-colors placeholder-zinc-400"></textarea>
        
        <div class="border border-dashed border-zinc-300 dark:border-zinc-700 rounded-xl p-4 bg-zinc-50 dark:bg-zinc-800">
            <input type="file" name="file" accept=".pdf" required class="w-full text-sm text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-zinc-200 file:text-zinc-900 hover:file:bg-zinc-300 cursor-pointer transition-colors">
        </div>
        
        <button type="submit" class="w-full bg-[#18181B] dark:bg-white text-white dark:text-zinc-900 font-semibold py-3.5 rounded-xl hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-all mt-4">
            Run Analysis
        </button>
    </form>
</div>
{% endblock %}
