{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-sm mx-auto bg-white dark:bg-zinc-900 rounded-2xl p-8 sm:p-10 mt-12 shadow-sm border border-zinc-100 dark:border-zinc-800 transition-colors duration-300">
    <h2 class="text-2xl font-bold text-zinc-900 dark:text-white mb-8 tracking-tight transition-colors">Welcome back.</h2>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <!-- SAFE REDIRECT LOGIC -->
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% elif 'next' in request.GET %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% else %}
            <input type="hidden" name="next" value="{% url 'job_list' %}">
        {% endif %}
        
        <div>
            <input type="text" name="username" placeholder="Username / Email" required 
                class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white outline-none focus:bg-white dark:focus:bg-zinc-900 focus:border-zinc-400 transition-colors placeholder-zinc-400">
        </div>
        <div>
            <input type="password" name="password" placeholder="Password" required 
                class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white outline-none focus:bg-white dark:focus:bg-zinc-900 focus:border-zinc-400 transition-colors placeholder-zinc-400">
        </div>
        
        <button type="submit" class="w-full bg-[#18181B] dark:bg-white text-white dark:text-zinc-900 font-semibold py-3.5 rounded-xl hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-all mt-4">
            Login
        </button>
    </form>

    <div class="relative mt-8 mb-6">
        <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-zinc-200 dark:border-zinc-700 transition-colors"></div>
        </div>
        <div class="relative flex justify-center text-sm">
            <span class="px-3 bg-white dark:bg-zinc-900 text-zinc-500 transition-colors">Or continue with</span>
        </div>
    </div>

    <!-- GOOGLE & LINKEDIN GRID -->
    <div class="grid grid-cols-2 gap-3">
        <!-- Google -->
        <button type="button" onclick="alert('Google Auth will be activated after deployment!')" class="w-full flex justify-center items-center py-3 border border-zinc-200 dark:border-zinc-700 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors text-zinc-900 dark:text-white font-medium text-sm">
            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
        </button>
        <!-- LinkedIn -->
        <button type="button" onclick="alert('LinkedIn Auth will be activated after deployment!')" class="w-full flex justify-center items-center py-3 border border-zinc-200 dark:border-zinc-700 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors text-zinc-900 dark:text-white font-medium text-sm">
            <svg class="w-5 h-5 mr-2" fill="#0A66C2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.23 0H1.77C.8 0 0 .77 0 1.72v20.56C0 23.23.8 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.2 0 22.23 0zM7.12 20.45H3.56V9h3.56v11.45zM5.34 7.43c-1.14 0-2.06-.92-2.06-2.06 0-1.14.92-2.06 2.06-2.06s2.06.92 2.06 2.06c0 1.14-.92 2.06-2.06 2.06zm15.11 13.02h-3.56v-5.56c0-1.32-.02-3.02-1.84-3.02-1.84 0-2.12 1.44-2.12 2.92v5.66h-3.56V9h3.42v1.56h.05c.48-.9 1.63-1.84 3.35-1.84 3.58 0 4.25 2.36 4.25 5.43v6.3z"/>
            </svg>
            LinkedIn
        </button>
    </div>

    <div class="mt-8 text-center text-sm text-zinc-500 transition-colors">
        Don't have an account? 
        <a href="{% url 'signup' %}" class="font-bold text-zinc-900 dark:text-white hover:underline transition-colors">Sign up</a>
    </div>
</div>
{% endblock %}
