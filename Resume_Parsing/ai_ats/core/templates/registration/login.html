{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-3xl p-10 mt-20 shadow-[8px_8px_0px_0px_rgba(99,102,241,0.2)] transition-colors duration-300">
    <h2 class="text-3xl font-black text-slate-900 dark:text-white mb-6 transition-colors">Recruiter Login</h2>
    
    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <!-- SAFE REDIRECT LOGIC -->
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% else %}
            <input type="hidden" name="next" value="{% url 'job_list' %}">
        {% endif %}
        
        <div>
            <label class="block font-bold text-slate-700 dark:text-slate-300 mb-2 transition-colors">Username</label>
            <input type="text" name="username" required class="w-full p-3 rounded-xl border-2 border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:border-indigo-500 transition-colors">
        </div>
        <div>
            <label class="block font-bold text-slate-700 dark:text-slate-300 mb-2 transition-colors">Password</label>
            <input type="password" name="password" required class="w-full p-3 rounded-xl border-2 border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white outline-none focus:border-indigo-500 transition-colors">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white border-2 border-indigo-400 font-bold text-lg py-3 rounded-xl shadow-[4px_4px_0px_0px_rgba(99,102,241,0.5)] hover:translate-y-1 hover:translate-x-1 hover:shadow-none transition-all">
            Secure Login &rarr;
        </button>
    </form>
</div>
{% endblock %}
