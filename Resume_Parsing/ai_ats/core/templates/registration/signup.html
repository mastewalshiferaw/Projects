{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-zinc-900 rounded-2xl p-8 sm:p-10 mt-12 shadow-sm border border-zinc-100 dark:border-zinc-800">
    <h2 class="text-2xl font-bold text-zinc-900 dark:text-white mb-2 tracking-tight">Create an Account</h2>
    <p class="text-zinc-500 text-sm mb-8">Join the minimalist ATS platform.</p>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <!-- Render Django's Secure Form Fields -->
        {% for field in form %}
            <div>
                <label class="block text-sm font-bold text-zinc-700 dark:text-zinc-300 mb-1">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" required 
                    class="w-full px-4 py-3 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white outline-none focus:bg-white dark:focus:bg-zinc-900 focus:border-zinc-400 transition-colors placeholder-zinc-400">
                
                <!-- Display any password errors -->
                {% if field.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="w-full bg-[#18181B] dark:bg-white text-white dark:text-zinc-900 font-semibold py-3.5 rounded-xl hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-all mt-6">
            Sign Up
        </button>
    </form>

    <div class="mt-8 text-center text-sm text-zinc-500">
        Already have an account? 
        <a href="{% url 'login' %}" class="font-bold text-zinc-900 dark:text-white hover:underline">Log in</a>
    </div>
</div>
{% endblock %}
