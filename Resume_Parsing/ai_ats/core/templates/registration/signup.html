{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-zinc-900 border-2 border-zinc-200 dark:border-zinc-700 rounded-3xl p-8 sm:p-10 mt-12 shadow-[8px_8px_0px_0px_rgba(99,102,241,0.2)] transition-colors duration-300">
    <h2 class="text-2xl font-bold text-zinc-900 dark:text-white mb-2 tracking-tight transition-colors">Create an Account</h2>
    <p class="text-zinc-500 text-sm mb-8 transition-colors">Join the minimalist ATS platform.</p>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        {% for field in form %}
            <div>
                <label class="block text-sm font-bold text-zinc-700 dark:text-zinc-300 mb-1 transition-colors">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" required 
                    class="w-full px-4 py-3 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white outline-none focus:bg-white dark:focus:bg-zinc-900 focus:border-zinc-400 transition-colors placeholder-zinc-400">
                {% if field.errors %}
                    <p class="text-red-500 text-xs mt-1 font-medium">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="w-full bg-[#18181B] dark:bg-white text-white dark:text-zinc-900 font-semibold py-3.5 rounded-xl hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-all mt-6">
            Sign Up &rarr;
        </button>
    </form>

    <div class="relative mt-8 mb-6">
        <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-zinc-200 dark:border-zinc-700 transition-colors"></div>
        </div>
        <div class="relative flex justify-center text-sm">
            <span class="px-3 bg-white dark:bg-zinc-900 text-zinc-500 transition-colors">Or sign up with</span>
        </div>
    </div>

    <!-- UI GOOGLE BUTTON (Fixed Official Logo) -->
    <button type="button" onclick="alert('Google Auth will be activated after deployment!')" class="w-full flex justify-center items-center py-3.5 border border-zinc-200 dark:border-zinc-700 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors text-zinc-900 dark:text-white font-medium">
        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
    </button>

    <div class="mt-8 text-center text-sm text-zinc-500 transition-colors">
        Already have an account? 
        <a href="{% url 'login' %}" class="font-bold text-zinc-900 dark:text-white hover:underline transition-colors">Log in</a>
    </div>
</div>
{% endblock %}
