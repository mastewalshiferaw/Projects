{% extends 'core/base.html' %}

{% load socialaccount %} <!-- LOAD THE SOCIAL AUTH TAGS! -->

{% block content %}
<div class="max-w-sm mx-auto bg-white dark:bg-zinc-900 rounded-2xl p-8 sm:p-10 mt-12 shadow-sm border border-zinc-100 dark:border-zinc-800">
    <h2 class="text-2xl font-bold text-zinc-900 dark:text-white mb-8 tracking-tight">Welcome back.</h2>
    
    <!-- STANDARD EMAIL LOGIN -->
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% else %}
            <input type="hidden" name="next" value="{% url 'job_list' %}">
        {% endif %}
        
        <div>
            <input type="text" name="username" placeholder="Email Address" required 
                class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white outline-none focus:bg-white dark:focus:bg-zinc-900 focus:border-zinc-400 transition-colors placeholder-zinc-400">
        </div>
        <div>
            <input type="password" name="password" placeholder="Password" required 
                class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-white outline-none focus:bg-white dark:focus:bg-zinc-900 focus:border-zinc-400 transition-colors placeholder-zinc-400">
        </div>
        
        <button type="submit" class="w-full bg-[#18181B] dark:bg-white text-white dark:text-zinc-900 font-semibold py-3.5 rounded-xl hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-all mt-4">
            Login with Email
        </button>
    </form>

    <div class="relative mt-8 mb-6">
        <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-zinc-200 dark:border-zinc-700"></div>
        </div>
        <div class="relative flex justify-center text-sm">
            <span class="px-3 bg-white dark:bg-zinc-900 text-zinc-500">Or continue with</span>
        </div>
    </div>

    <!-- ACTUAL WORKING GOOGLE & LINKEDIN BUTTONS -->
    <div class="grid grid-cols-2 gap-4">
        
        <!-- Google Login Form -->
        <form action="{% provider_login_url 'google' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="w-full flex justify-center items-center py-3.5 border border-zinc-200 dark:border-zinc-700 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors text-zinc-900 dark:text-white font-medium">
                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24"><path fill="#EA4335" d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972-3.332 0-6.033-2.701-6.033-6.032s2.701-6.032 6.033-6.032c1.498 0 2.866.549 3.921 1.453l2.814-2.814C17.503 2.988 15.139 2 12.545 2 7.021 2 2.543 6.477 2.543 12s4.478 10 10.002 10c8.396 0 10.249-7.85 9.426-11.761h-9.426z"/><path fill="#4285F4" d="M23.971 12.239c0-.825-.138-1.583-.356-2.31H12.545v4.38h6.413c-.275 1.558-1.161 2.879-2.463 3.766l3.992 3.1c2.336-2.148 3.484-5.321 3.484-8.936z"/><path fill="#FBBC05" d="M6.512 14.537c-.244-.73-.385-1.517-.385-2.324s.141-1.594.385-2.324L2.698 7.075A9.972 9.972 0 00.543 12.21c0 1.611.385 3.137 1.056 4.478l3.913-3.151z"/><path fill="#34A853" d="M12.545 22.21c3.197 0 5.875-1.059 7.833-2.866l-3.992-3.1c-1.059.712-2.427 1.133-3.841 1.133-2.955 0-5.441-1.996-6.333-4.674l-3.913 3.151C4.364 19.863 8.118 22.21 12.545 22.21z"/></svg>
                Google
            </button>
        </form>

        <!-- LinkedIn Login Form -->
        <form action="{% provider_login_url 'linkedin_oauth2' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="w-full flex justify-center items-center py-3.5 border border-zinc-200 dark:border-zinc-700 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors text-zinc-900 dark:text-white font-medium">
                <svg class="w-5 h-5 mr-2" fill="#0A66C2" viewBox="0 0 24 24"><path d="M22.23 0H1.77C.8 0 0 .77 0 1.72v20.56C0 23.23.8 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.2 0 22.23 0zM7.12 20.45H3.56V9h3.56v11.45zM5.34 7.43c-1.14 0-2.06-.92-2.06-2.06 0-1.14.92-2.06 2.06-2.06s2.06.92 2.06 2.06c0 1.14-.92 2.06-2.06 2.06zm15.11 13.02h-3.56v-5.56c0-1.32-.02-3.02-1.84-3.02-1.84 0-2.12 1.44-2.12 2.92v5.66h-3.56V9h3.42v1.56h.05c.48-.9 1.63-1.84 3.35-1.84 3.58 0 4.25 2.36 4.25 5.43v6.3z"/></svg>
                LinkedIn
            </button>
        </form>
    </div>
{% endblock %}
